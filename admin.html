<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDV Pedidos — Admin</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-container">
  <!-- Login Area -->
  <div id="login-area" style="display:none;max-width:400px;margin:4rem auto;background:white;padding:2rem;border-radius:var(--radius-xl);box-shadow:var(--shadow-lg);">
    <div style="text-align:center;margin-bottom:1.5rem">
      <div style="font-size:2.5rem">🛵</div>
      <h2 style="margin-top:0.5rem;font-size:1.25rem">PDV Pedidos</h2>
      <p style="color:var(--gray-400);font-size:0.875rem">Acesso restrito a administradores</p>
    </div>
    <div id="login-form-area"></div>
  </div>

  <!-- App Area (protegida) -->
  <div id="app-area" style="display:none">
    <!-- Top Bar -->
    <div class="topbar">
      <div class="topbar-left">
        <div class="topbar-brand">
          <span class="topbar-brand-icon">🛵</span>
          <span>PDV Pedidos</span>
        </div>
        <span id="offline-badge" style="display:none;background:var(--warning);color:white;font-size:0.6875rem;padding:0.125rem 0.5rem;border-radius:999px;font-weight:700">
          ⚠️ Offline (<span id="pending-count">0</span>)
        </span>
      </div>
      <div class="topbar-actions">
        <button class="btn btn-secondary btn-sm" onclick="app.exportData()">📥 Exportar</button>
        <button class="btn btn-secondary btn-sm" onclick="document.getElementById('importFile').click()">📤 Importar</button>
        <input type="file" id="importFile" accept=".json" style="display:none" onchange="app.importData(this)">
        <button class="btn btn-primary" onclick="app.openNovoPedido()">
          <span>+</span> Novo pedido
        </button>
        <div id="logado-area" style="display:none;align-items:center;gap:0.5rem">
          <span id="logado-nome" style="font-size:0.8125rem;font-weight:600;color:var(--gray-600)"></span>
          <button class="btn btn-ghost btn-sm" onclick="fazerLogout()">Sair</button>
        </div>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-label">Total do dia</div>
        <div class="stat-value primary" id="stat-total-dia">R$ 0,00</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pedidos hoje</div>
        <div class="stat-value" id="stat-pedidos-hoje">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Em preparação</div>
        <div class="stat-value warning" id="stat-em-preparacao">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Entregues</div>
        <div class="stat-value success" id="stat-entregues">0</div>
      </div>
    </div>

    <!-- Filters -->
    <div class="filter-bar">
      <button class="filter-btn active" onclick="app.setFilter('tudo')" id="filter-tudo">
        ✓ Tudo <span class="filter-badge" id="badge-tudo">0</span>
      </button>
      <button class="filter-btn" onclick="app.setFilter('pendente')" id="filter-pendente">
        Pendente <span class="filter-badge" id="badge-pendente">0</span>
      </button>
      <button class="filter-btn" onclick="app.setFilter('em_preparacao')" id="filter-em_preparacao">
        Em curso <span class="filter-badge" id="badge-em_preparacao">0</span>
      </button>
      <button class="filter-btn" onclick="app.setFilter('pronto')" id="filter-pronto">
        Pronto <span class="filter-badge" id="badge-pronto">0</span>
      </button>
      <button class="filter-btn" onclick="app.setFilter('entregue')" id="filter-entregue">
        Entregue <span class="filter-badge" id="badge-entregue">0</span>
      </button>

      <div class="filter-right">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="searchInput" placeholder="Buscar pedido..." oninput="app.search(this.value)">
        </div>
      </div>
    </div>

    <!-- Orders List -->
    <div class="orders-card">
      <div class="orders-header">
        <div>Pedido</div>
        <div>Estado</div>
        <div>Total</div>
        <div>Cliente</div>
        <div>Endereço</div>
        <div style="text-align:right">Ações</div>
      </div>
      <div id="ordersList"></div>
    </div>
  </div>
</div>

<!-- Modal Novo Pedido -->
<div class="modal-overlay" id="modalOverlay" onclick="app.closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div class="modal-title" id="modalTitle">Novo Pedido</div>
      <button class="modal-close" onclick="app.closeModal()">&times;</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-footer">
      <button class="btn btn-secondary" onclick="app.closeModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="app.salvarPedido()">Salvar Pedido</button>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/auth.js"></script>
<script src="js/app.js"></script>
<script>
  (async function bootAdmin() {
    try {
      console.log('[Admin] Abrindo IndexedDB...');
      await openIDB();
      console.log('[Admin] IndexedDB aberto');

      console.log('[Admin] Iniciando auth...');
      await initAuth();
      console.log('[Admin] Auth inicializado. Usuario:', currentUser ? currentUser.nome : 'nenhum');

      console.log('[Admin] Verificando seed de usuarios...');
      await seedUsuariosPDV();
      console.log('[Admin] Seed de usuarios OK');

      const loginArea = document.getElementById('login-area');
      const appArea = document.getElementById('app-area');

      if (!currentUser) {
        console.log('[Admin] Sem usuario logado, mostrando login');
        if (loginArea) loginArea.style.display = 'block';
        if (appArea) appArea.style.display = 'none';
        renderLoginForm();
      } else {
        console.log('[Admin] Usuario logado:', currentUser.nome);
        if (loginArea) loginArea.style.display = 'none';
        if (appArea) appArea.style.display = 'block';
        const logArea = document.getElementById('logado-area');
        if (logArea) logArea.style.display = 'flex';
        const nm = document.getElementById('logado-nome');
        if (nm) nm.textContent = currentUser.nome + ' (' + currentUser.role + ')';
        if (typeof app !== 'undefined' && app.init) {
          await app.init();
          console.log('[Admin] App inicializado');
        } else {
          console.error('[Admin] Objeto app nao encontrado!');
        }
      }
    } catch (err) {
      console.error('[Admin] Erro fatal no boot:', err);
      document.body.innerHTML = '<div style="padding:2rem;text-align:center"><h2>Erro ao carregar o sistema</h2><p>' + err.message + '</p><pre style="text-align:left;background:#f5f5f5;padding:1rem;border-radius:8px;margin-top:1rem">' + err.stack + '</pre></div>';
    }
  })();
</script>
</body>
</html>
